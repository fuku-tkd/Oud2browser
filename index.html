function renderDiagram(){

    const dia=
        database.dias[
            Number(
                diaSelect.value
            )
        ];


    if(!dia)return;


    const trains=
        getVisibleTrains(dia);


    const zoom=
        Number(
            zoomInput.value
        )/100;


    const geometry=
        calculateStationY(
            dia,
            zoom
        );


    const stationY=
        geometry.y;

    const sectionTimes=
        geometry.section;


    const left=
        72*zoom;


    const minuteWidth=
        horizontalRatio*zoom;


    const width=
        left+
        minuteWidth*24*60+
        60;


    const height=
        stationY[
            stationY.length-1
        ]+
        55*zoom;


    diagram.setAttribute(
        "width",
        width
    );

    diagram.setAttribute(
        "height",
        height
    );


    diagram.innerHTML="";

    stationLabelOverlay.innerHTML="";
    stationLabelOverlay.style.width=left+"px";
    stationLabelOverlay.style.height=height+"px";
    stationLabelOverlay.style.marginBottom="-"+height+"px";

    database.stations.forEach(function(station,index){
        const label=document.createElement("div");
        label.className="stationFixedLabel"+(station.hidden?" hidden":"");
        label.textContent=station.name;
        label.style.top=(stationY[index]-8*zoom)+"px";
        label.style.right=(8*zoom)+"px";
        label.style.fontSize=(12*zoom)+"px";
        label.style.lineHeight=(16*zoom)+"px";
        stationLabelOverlay.appendChild(label);
    });

    syncStationLabelScroll();

    empty.style.display="none";


    const NS=
        "http://www.w3.org/2000/svg";


    function svgElement(
        tag,
        attrs={}
    ){

        const e=
            document.createElementNS(
                NS,
                tag
            );


        Object.keys(attrs)
            .forEach(function(key){

                e.setAttribute(
                    key,
                    attrs[key]
                );

            });


        diagram.appendChild(e);

        return e;

    }


    /*
     * 背景
     */

    svgElement(
        "rect",
        {
            x:0,
            y:0,
            width,
            height,
            fill:"#ffffff"
        }
    );


    /*
     * 時刻線
     *
     * 横縮尺に応じて補助線の間隔を自動調整。
     * 小さい縮尺では1時間ごと、拡大すると30分・15分・10分ごと。
     */
    const gridMinutes = 10;

    for(
        let minute=0;
        minute<=24*60;
        minute+=gridMinutes
    ){
        const x=
            left+
            minute*minuteWidth;

        const isHour=minute%60===0;
        const isHalfHour=minute%30===0;

        svgElement(
            "line",
            {
                x1:x,
                y1:20*zoom,
                x2:x,
                y2:height,
                stroke:
                    isHour
                        ? "#b8c0c7"
                        : "#e5e8eb",
                "stroke-width":
                    isHour
                        ? 1.5
                        : isHalfHour
                            ? 1
                            : 0.7
            }
        );

        if(isHour && minute<24*60){
            const totalHour=2+minute/60;
            const labelHour=
                totalHour>=24
                    ? totalHour-24
                    : totalHour;

            const text=
                svgElement(
                    "text",
                    {
                        x:x+3*zoom,
                        y:17*zoom,
                        "font-size":12*zoom,
                        fill:"#59656f"
                    }
                );

            text.textContent=
                String(labelHour).padStart(2,"0")+":00";
        }
    }


    /*
     * 駅線
     *
     * 常に下り基準。
     */
    database.stations.forEach(
        function(station,index){

            const y=
                stationY[index];


            svgElement(
                "line",
                {
                    x1:left,
                    y1:y,
                    x2:width,
                    y2:y,
                    stroke:
                        station.hidden
                            ? "#f2f3f4"
                            : "#e5e8eb",
                    "stroke-width":
                        station.hidden
                            ? 0.5
                            : 1
                }
            );




        }
    );


    /*
     * 駅間所要時間
     *
     * ★下りだけから取得
     */

    for(
        let i=0;
        i<sectionTimes.length;
        i++
    ){

        const minutes=
            sectionTimes[i];

        if(minutes===null)continue;


        const y1=
            stationY[i];

        const y2=
            stationY[i+1];


        const text=
            svgElement(
                "text",
                {
                    x:left+3,
                    y:(y1+y2)/2,
                    "font-size":9*zoom,
                    fill:"#a0a8ae"
                }
            );


        text.textContent=
            Math.abs(
                minutes-
                Math.round(minutes)
            )<0.05
                ? Math.round(minutes)+"分"
                : minutes.toFixed(1)+"分";

    }


    /*
     * 列車
     */

    trains.forEach(
        function(train){

            drawTrain(
                train,
                left,
                stationY,
                minuteWidth,
                zoom
            );

        }
    );

}


/* =========================================================
   TRAIN GROUPS
========================================================= */

/*
 * 列車データを駅の連続区間に分割。
 *
 * 上りでもここでは元データ駅番号を使う。
 * 実際の描画時に
 *
 *   displayStationIndex()
 *
 * で下り基準へ変換する。
 */
function buildTrainGroups(train){

    const groups=[];

    let current=[];


    const limit=
        Math.min(
            train.times.length,
            database.stations.length
        );


    for(
        let i=0;
        i<limit;
        i++
    ){

        const time=
            train.times[i];


        if(
            !time ||
            time.exists!==true
        ){

            if(current.length){

                groups.push(
                    current
                );

                current=[];

            }

            continue;

        }


        current.push({

            stationIndex:i,

            time

        });

    }


    if(current.length){

        groups.push(
            current
        );

    }


    return groups;

}


/* =========================================================
   TRAIN INTERPOLATION
========================================================= */

function interpolateTrainGroup(
    group,
    stationY,
    trainDirection,
    sectionTimes
){

    const result=
        new Array(
            group.length
        ).fill(null);


    const actual=[];


    group.forEach(
        function(item,index){

            const t=
                item.time;


            if(
                !t ||
                !hasActualTime(t)
            ){

                return;

            }


            const arrival=
                t.arrival!==null &&
                t.arrival!==undefined
                    ? t.arrival
                    : t.departure;


            const departure=
                t.departure!==null &&
                t.departure!==undefined
                    ? t.departure
                    : t.arrival;


            actual.push({

                groupIndex:index,

                stationIndex:
                    item.stationIndex,

                arrival,

                departure

            });

        }
    );


    if(!actual.length){
        return result;
    }


    /*
     * 実時刻。
     */

    actual.forEach(
        function(point){

            result[
                point.groupIndex
            ]={

                arrival:
                    point.arrival,

                departure:
                    point.departure,

                actual:true

            };

        }
    );


    /*
     * 通過駅の補間。
     *
     * 下りは駅番号が増加、上りは駅番号が減少する。
     * ここでは元の駅番号順をそのまま使い、方向に応じて
     * ループを進めることで、上りでも正しい経路上の区間だけを
     * 基準時間として積算する。
     *
     * 例:
     *   A-B = 10分
     *   B-D = 15分
     *   A 10:00 → D 10:15
     *
     * 基準時間比で B は 10:06。
     *
     * ★ダイヤ描画専用。時刻表・元の時刻データは変更しない。
     */

    for(
        let a=0;
        a<actual.length-1;
        a++
    ){

        const leftPoint=
            actual[a];

        const rightPoint=
            actual[a+1];


        const index1=
            leftPoint.groupIndex;

        const index2=
            rightPoint.groupIndex;


        if(
            Math.abs(index2-index1)<=1
        ){

            continue;

        }


        const start=
            leftPoint.departure;

        const end=
            rightPoint.arrival;


        if(
            !Number.isFinite(start) ||
            !Number.isFinite(end)
        ){

            continue;

        }


        let diff=
            end-start;


        if(diff<0){
            diff+=24*60;
        }


        if(
            !Number.isFinite(diff) ||
            diff<=0
        ){
            continue;
        }


        const step=
            index2>index1
                ? 1
                : -1;


        const weights=[];
        let totalBase=0;


        /*
         * 列車が実際に通る駅間だけを積算する。
         *
         * 下り: i, i+1
         * 上り: i, i-1
         *
         * sectionTimes は常に下り基準の駅番号で保持されているため、
         * 上りでも Math.min(A,B) を使えば同じ駅間を参照できる。
         */
        for(
            let i=index1;
            i!==index2;
            i+=step
        ){

            const nextIndex=
                i+step;

            const stationA=
                group[i].stationIndex;

            const stationB=
                group[nextIndex].stationIndex;

            let weight=null;


            if(
                Array.isArray(sectionTimes)
            ){

                const lo=Math.min(
                    stationA,
                    stationB
                );

                if(
                    lo>=0 &&
                    lo<sectionTimes.length &&
                    Number.isFinite(
                        Number(sectionTimes[lo])
                    ) &&
                    Number(sectionTimes[lo])>0
                ){
                    weight=
                        Number(sectionTimes[lo]);
                }

            }


            /*
             * 基準時間が取得できない区間だけ、元の描画用Y距離を使用。
             * これも元データには一切書き戻さない。
             */
            if(weight===null){

                const displayA=
                    displayStationIndex(
                        stationA,
                        trainDirection
                    );

                const displayB=
                    displayStationIndex(
                        stationB,
                        trainDirection
                    );

                const yA=stationY[displayA];
                const yB=stationY[displayB];

                if(
                    Number.isFinite(yA) &&
                    Number.isFinite(yB) &&
                    yA!==yB
                ){
                    weight=Math.abs(yB-yA);
                }else{
                    weight=1;
                }

            }


            weights.push(weight);
            totalBase+=weight;

        }


        if(
            !Number.isFinite(totalBase) ||
            totalBase<=0
        ){
            continue;
        }


        let accumulated=0;


        /*
         * 実際の駅列の途中にある通過駅へ時刻を入れる。
         * 上りなら i-1 側へ結果を書き込むので、
         * 駅番号を逆転させる必要はない。
         */
        let current=index1;
        let weightIndex=0;

        while(current!==index2){

            const nextIndex=
                current+step;

            accumulated+=
                weights[weightIndex];

            weightIndex++;


            if(nextIndex!==index2){

                const ratio=
                    accumulated/totalBase;

                const minute=
                    start+
                    diff*ratio;

                result[nextIndex]={

                    arrival:minute,

                    departure:minute,

                    actual:false

                };

            }

            current=nextIndex;

        }

    }


    return result;

}


/* =========================================================
   TRAIN SEGMENTS
========================================================= */

function buildTrainSegments(
    train,
    stationY,
    left,
    minuteWidth
){

    const groups=
        buildTrainGroups(
            train
        );


    const segments=[];


    groups.forEach(
        function(group){

            if(group.length<2)return;


            const times=
                interpolateTrainGroup(
                    group,
                    stationY,
                    train.direction
                );


            /*
             * ★列車ごとの表示座標。
             *
             * 下り:
             *
             * 0 → 1 → 2 → 3
             *
             * 上り:
             *
             * 3 → 2 → 1 → 0
             *
             * を
             *
             * 0 → 1 → 2 → 3
             *
             * に変換する。
             */

            let points=[];


            function addPoint(
                item,
                minute,
                kind,
                calculated
            ){

                if(
                    !Number.isFinite(minute)
                ){

                    return;

                }


                const displayIndex=
                    displayStationIndex(
                        item.stationIndex,
                        train.direction
                    );


                points.push({

                    x:
                        left+
                        (minute-120)*
                        minuteWidth,

                    y:
                        stationY[
                            displayIndex
                        ],

                    stationIndex:
                        item.stationIndex,

                    displayStationIndex:
                        displayIndex,

                    time:item.time,

                    minute,

                    kind,

                    passed:
                        item.time.passed===true,

                    calculated:
                        calculated===true

                });

            }


            group.forEach(
                function(item,index){

                    const t=
                        times[index];


                    if(!t){

                        if(points.length>=2){

                            segments.push(
                                points
                            );

                        }

                        points=[];

                        return;

                    }


                    /*
                     * 着
                     */

                    addPoint(
                        item,
                        t.arrival,
                        "arrival",
                        !t.actual
                    );


                    /*
                     * 発
                     *
                     * 長時間停車なら
                     * 水平線ができる。
                     */

                    if(
                        t.departure!==t.arrival
                    ){

                        addPoint(
                            item,
                            t.departure,
                            "departure",
                            !t.actual
                        );

                    }

                }
            );


            if(points.length>=2){

                segments.push(
                    points
                );

            }

        }
    );


    return segments;

}


/* =========================================================
   TRAIN DRAW
========================================================= */

function drawTrain(
    train,
    left,
    stationY,
    minuteWidth,
    zoom
){

    const type=
        database.types[
            train.typeIndex
        ]||
        {

            name:"不明",

            short:"?",

            diagramColor:"#555"

        };


    const segments=
        buildTrainSegments(
            train,
            stationY,
            left,
            minuteWidth
        );


    const NS=
        "http://www.w3.org/2000/svg";


    segments.forEach(
        function(points){

            if(points.length<2)return;


            const polyline=
                document.createElementNS(
                    NS,
                    "polyline"
                );


            polyline.setAttribute(
                "points",
                points
                    .map(
                        p=>
                            p.x+
                            ","+
                            p.y
                    )
                    .join(" ")
            );


            polyline.setAttribute(
                "fill",
                "none"
            );


            polyline.setAttribute(
                "stroke",
                type.diagramColor
            );


            polyline.setAttribute(
                "stroke-width",
                type.name==="普通"
                    ? 1.2*zoom
                    : 2*zoom
            );


            polyline.setAttribute(
                "stroke-linecap",
                "round"
            );


            polyline.setAttribute(
                "stroke-linejoin",
                "round"
            );


            polyline.style.cursor=
                "pointer";


            /*
             * 上り・下りを
             * 同じ見た目で描く。
             *
             * 両方モードでは
             * 種別色はそのまま。
             */

            polyline.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();

                    showTrainInfo(
                        train,
                        type
                    );

                }
            );


            diagram.appendChild(
                polyline
            );


            /*
             * 実時刻駅だけ○。
             *
             * 補間駅には○を出さない。
             */

            points.forEach(
                function(point){

                    if(
                        point.passed ||
                        point.calculated
                    ){

                        return;

                    }


                    const circle=
                        document.createElementNS(
                            NS,
                            "circle"
                        );


                    circle.setAttribute(
                        "cx",
                        point.x
                    );


                    circle.setAttribute(
                        "cy",
                        point.y
                    );


                    circle.setAttribute(
                        "r",
                        1.8*zoom
                    );


                    circle.setAttribute(
                        "fill",
                        type.diagramColor
                    );


                    circle.style.cursor=
                        "pointer";


                    circle.addEventListener(
                        "click",
                        function(event){

                            event.stopPropagation();

                            showTrainInfo(
                                train,
                                type
                            );

                        }
                    );


                    diagram.appendChild(
                        circle
                    );

                }
            );

        }
    );

}


/* =========================================================
   TRAIN INFO
========================================================= */

function showTrainInfo(
    train,
    type
){

    trainInfo.style.display=
        "block";


    trainInfoTitle.textContent=
        type.name+
        "　"+
        (
            train.direction==="Kudari"
                ? "下り"
                : "上り"
        );


    const valid=
        train.times
            .map(
                function(time,index){

                    if(
                        !hasActualTime(time)
                    ){

                        return null;

                    }


                    const minute=
                        usableTime(time);


                    if(minute===null){

                        return null;

                    }


                    return{

                        station:
                            database.stations[
                                index
                            ],

                        minute,

                        time

                    };

                }
            )
            .filter(Boolean);


    if(!valid.length){

        trainInfoBody.textContent=
            "時刻情報なし";

        return;

    }


    const first=
        valid[0];

    const last=
        valid[
            valid.length-1
        ];


    let html="";


    html+=
        '<div class="infoLine">'+
        "<b>始発:</b> "+
        escapeHtml(
            first.station.name
        )+
        " "+
        formatTime(
            first.minute
        )+
        "</div>";


    html+=
        '<div class="infoLine">'+
        "<b>終着:</b> "+
        escapeHtml(
            last.station.name
        )+
        " "+
        formatTime(
            last.minute
        )+
        "</div>";


    html+=
        '<div class="infoLine">'+
        "<b>時刻数:</b> "+
        valid.length+
        "</div>";


    const operationKeys=
        Object.keys(
            train.operations
        );


    if(operationKeys.length){

        html+=
            "<hr>"+
            '<div class="muted">運用情報</div>';


        operationKeys.forEach(
            function(key){

                html+=
                    '<div class="infoLine">'+
                    escapeHtml(key)+
                    ": "+
                    escapeHtml(
                        train.operations[key]
                    )+
                    "</div>";

            }
        );

    }


    trainInfoBody.innerHTML=
        html;

}


/* =========================================================
   TRAIN TABLE
========================================================= */

function renderTrainTable(){

    const dia=
        database.dias[
            Number(
                diaSelect.value
            )
        ];


    if(!dia)return;


    const trains=
        getVisibleTrains(
            dia
        );


    trainTable.innerHTML="";


    trains.forEach(
        function(train,index){

            const type=
                database.types[
                    train.typeIndex
                ]||
                {

                    name:"不明",

                    diagramColor:"#555"

                };


            const valid=
                train.times
                    .map(
                        function(
                            time,
                            stationIndex
                        ){

                            if(
                                !hasActualTime(
                                    time
                                )
                            ){

                                return null;

                            }


                            const minute=
                                usableTime(
                                    time
                                );


                            if(
                                minute===null
                            ){

                                return null;

                            }


                            return{

                                stationIndex,

                                minute

                            };

                        }
                    )
                    .filter(Boolean);


            const first=
                valid[0];

            const last=
                valid[
                    valid.length-1
                ];


            const tr=
                document.createElement(
                    "tr"
                );


            tr.className=
                "trainRow";


            tr.innerHTML=

                "<td>"+
                (index+1)+
                "</td>"+

                '<td style="color:'+
                type.diagramColor+
                ';font-weight:600">'+
                escapeHtml(
                    type.name
                )+
                "</td>"+

                "<td>"+
                (
                    train.direction==="Kudari"
                        ? "下り"
                        : "上り"
                )+
                "</td>"+

                "<td>"+
                escapeHtml(
                    operationText(
                        train
                    )
                )+
                "</td>"+

                "<td>"+
                (
                    first
                        ? escapeHtml(
                            database.stations[
                                first.stationIndex
                            ].name
                        )+
                        " "+
                        formatTime(
                            first.minute
                        )
                        : ""
                )+
                "</td>"+

                "<td>"+
                (
                    last
                        ? escapeHtml(
                            database.stations[
                                last.stationIndex
                            ].name
                        )+
                        " "+
                        formatTime(
                            last.minute
                        )
                        : ""
                )+
                "</td>"+

                "<td>"+
                valid.length+
                "</td>";


            tr.addEventListener(
                "click",
                function(){

                    showTrainInfo(
                        train,
                        type
                    );

                }
            );


            trainTable.appendChild(
                tr
            );

        }
    );

}


/* =========================================================
   OPERATION
========================================================= */

function operationText(train){

    const keys=
        Object.keys(
            train.operations
        );


    if(!keys.length){
        return"";
    }


    return keys
        .map(
            key=>
                train.operations[key]
        )
        .join(" / ");

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(minute){

    if(
        minute===null ||
        minute===undefined ||
        !Number.isFinite(minute)
    ){

        return"";

    }


    let hour=
        Math.floor(
            minute/60
        );


    const min=
        minute%60;


    if(hour>=24){

        hour-=24;

    }


    return String(
        hour
    ).padStart(2,"0")+
    ":"+
    String(
        min
    ).padStart(2,"0");

}


/* =========================================================
   STATION SCROLL
========================================================= */

function scrollToStation(
    originalIndex
){

    if(!database)return;


    const dia=
        database.dias[
            Number(
                diaSelect.value
            )
        ];


    if(!dia)return;


    const zoom=
        Number(
            zoomInput.value
        )/100;


    const geometry=
        calculateStationY(
            dia,
            zoom
        );


    /*
     * 上り表示でも、
     * ダイヤ自体は下り基準の座標。
     *
     * 元駅番号 → 表示駅番号
     */

    const displayIndex=
        displayStationIndex(
            originalIndex,
            currentDirection==="Nobori"
                ? "Nobori"
                : "Kudari"
        );


    const y=
        geometry.y[
            displayIndex
        ]||0;


    diagramContainer.scrollTo({

        top:
            Math.max(
                0,
                y-100
            ),

        behavior:"smooth"

    });

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    return String(
        value??""
    ).replace(
        /[&<>"']/g,
        function(char){

            return{

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        }
    );

}


/* =========================================================
   SEGMENT UI
========================================================= */

function syncSegmentedUI(){

    document
    .querySelectorAll(
        ".segment[data-direction]"
    )
    .forEach(
        function(button){

            button.classList.toggle(
                "active",
                button.dataset.direction===
                currentDirection
            );

        }
    );


    document
    .querySelectorAll(
        ".segment[data-view]"
    )
    .forEach(
        function(button){

            button.classList.toggle(
                "active",
                button.dataset.view===
                currentView
            );

        }
    );

}


/* =========================================================
   ZOOM
========================================================= */

function setZoom(value){

    value=
        Math.round(
            Number(value)/10
        )*10;


    value=
        Math.max(
            50,
            Math.min(
                300,
                value
            )
        );


    zoomInput.value=
        value;


    if(database){
        render();
    }

}


/* =========================================================
   EVENTS
========================================================= */

diaSelect.addEventListener(
    "change",
    render
);


document
.querySelectorAll(
    ".segment[data-direction]"
)
.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                currentDirection=
                    this.dataset.direction;

                syncSegmentedUI();

                render();

            }
        );

    }
);


document
.querySelectorAll(
    ".segment[data-view]"
)
.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                currentView=
                    this.dataset.view;

                syncSegmentedUI();

                render();

            }
        );

    }
);


zoomInput.addEventListener(
    "change",
    function(){

        setZoom(
            this.value
        );

    }
);


document
.getElementById("zoomMinus")
.addEventListener(
    "click",
    function(){

        setZoom(
            Number(
                zoomInput.value
            )-10
        );

    }
);


document
.getElementById("zoomPlus")
.addEventListener(
    "click",
    function(){

        setZoom(
            Number(
                zoomInput.value
            )+10
        );

    }
);


document
.getElementById("resetViewButton")
.addEventListener(
    "click",
    function(){

        zoomInput.value=100;

        horizontalRatio=12;

        verticalRatio=12;

        currentDirection="Kudari";

        currentView="diagram";

        updateRatioUI();

        syncSegmentedUI();

        diagramContainer.scrollTo({

            top:0,

            left:0,

            behavior:"smooth"

        });

        if(database){
            render();
        }

    }
);


diagramContainer.addEventListener(
    "scroll",
    syncStationLabelScroll,
    {passive:true}
);


diagramContainer.addEventListener(
    "click",
    function(event){

        if(
            event.target===diagram
        ){

            trainInfo.style.display=
                "none";

        }

    }
);


syncSegmentedUI();

</script>
