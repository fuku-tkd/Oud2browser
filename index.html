<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OuDiaSecond Viewer</title>

<style>
*{box-sizing:border-box}

:root{
    --line:#dce2e7;
    --soft:#f6f8fa;
    --ink:#1e2730;
    --muted:#687681;
    --accent:#2867d8;
    --accentSoft:#eaf1ff;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
    color:var(--ink);
    background:var(--soft);
}

body{
    display:flex;
    flex-direction:column;
}

.appHeader{
    height:58px;
    flex-shrink:0;
    padding:0 14px;
    background:#18212a;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 1px 0 rgba(0,0,0,.12);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.brandMark{
    width:32px;
    height:32px;
    border-radius:9px;
    display:grid;
    place-items:center;
    background:#fff;
    color:#18212a;
    font-weight:800;
}

.appHeader h1{
    font-size:14px;
    margin:0;
    color:#fff;
}

.subTitle{
    font-size:10px;
    color:#aeb9c2;
    margin-top:2px;
    max-width:48vw;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.headerActions{
    display:flex;
    gap:6px;
}

.ghostButton{
    height:30px;
    background:transparent;
    color:#dbe3e9;
    border:1px solid #44515c;
    border-radius:7px;
    font-size:11px;
    padding:0 9px;
}

 .headerActions{position:relative;align-items:center;}
.menuButton{width:34px;height:34px;border:1px solid #44515c;border-radius:8px;background:transparent;color:#fff;font-size:22px;line-height:1;cursor:pointer;}
.menuButton:hover{background:#27333d;}
.viewMenu{position:absolute;right:0;top:40px;z-index:1000;display:none;min-width:150px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(25,40,55,.18);}
.viewMenu.open{display:block;}
.viewMenu button{display:block;width:100%;padding:9px 11px;border:0;background:#fff;text-align:left;font-size:12px;color:var(--ink);border-radius:6px;cursor:pointer;}
.viewMenu button:hover{background:var(--soft);}
.viewMenu .menuSetting{border-top:1px solid var(--line);margin-top:4px;padding-top:5px;}
.viewMenu .menuSetting label{display:flex;align-items:center;gap:7px;padding:8px 11px;font-size:12px;color:var(--ink);cursor:pointer;}
.viewMenu .menuSetting input{margin:0;}
.toolbarHidden{display:none !important;}

.toolbar{
    min-height:58px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    padding:7px 9px;
    background:#fff;
    border-bottom:1px solid var(--line);
    box-shadow:0 2px 8px rgba(25,40,55,.04);
}

.controlGroup{
    display:flex;
    align-items:center;
    gap:5px;
    height:34px;
    padding:3px 6px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
}

.controlGroup.compact{
    padding:3px 4px;
}

.controlLabel{
    font-size:10px;
    color:var(--muted);
    white-space:nowrap;
    font-weight:600;
}

.primaryButton{
    height:32px;
    padding:0 10px;
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    display:inline-flex;
    align-items:center;
    cursor:pointer;
    font-size:11px;
    font-weight:700;
}

.primaryButton input{
    display:none;
}

.toolbar select,
.toolbar input[type=number]{
    height:28px;
    border:0;
    outline:0;
    background:transparent;
    padding:0 4px;
    font-size:11px;
}

.toolbar select{
    min-width:100px;
}

.toolbar input[type=number]{
    width:48px;
    text-align:center;
}

.percent{
    font-size:10px;
    color:var(--muted);
}

.iconButton{
    width:27px;
    height:27px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    padding:0;
    font-size:15px;
    line-height:1;
    color:#34414c;
    cursor:pointer;
}

.iconButton:hover{
    background:var(--soft);
    border-color:#b9c4cc;
}

.segmented{
    display:flex;
    gap:2px;
    padding:3px;
    background:#edf1f4;
    border-radius:8px;
}

.segment{
    height:28px;
    border:0;
    border-radius:6px;
    padding:0 10px;
    background:transparent;
    font-size:11px;
    color:#65727d;
    cursor:pointer;
}

.segment.active{
    background:#fff;
    color:var(--accent);
    font-weight:700;
    box-shadow:0 1px 3px rgba(25,40,55,.1);
}

.ratioValue{
    min-width:54px;
    text-align:center;
    font-size:10px;
    color:#52606b;
}

.legend{
    display:flex;
    align-items:center;
    gap:7px;
    flex:1;
    min-width:120px;
    overflow:hidden;
}

.legendItem{
    display:flex;
    align-items:center;
    gap:3px;
    white-space:nowrap;
    font-size:10px;
}

.legendLine{
    width:15px;
    height:3px;
}

.statusPill{
    font-size:10px;
    color:#65727d;
    padding:5px 8px;
    border-radius:99px;
    background:#f0f3f5;
    white-space:nowrap;
}

.main{
    min-height:0;
    flex:1;
    display:grid;
    grid-template-columns:1fr;
}

.sidebar{
    min-height:0;
    background:#fff;
    border-right:1px solid var(--line);
    overflow-y:auto;
}

.sidebarTitle{
    position:sticky;
    top:0;
    z-index:10;
    padding:10px 11px;
    background:#fff;
    border-bottom:1px solid var(--line);
    font-size:11px;
    font-weight:700;
}

.station{
    display:flex;
    padding:7px 8px;
    border-bottom:1px solid #f0f2f3;
    font-size:11px;
    gap:2px;
    cursor:pointer;
}

.station:hover{
    background:var(--accentSoft);
}

.stationNumber{
    width:28px;
    flex-shrink:0;
    text-align:right;
    margin-right:7px;
    color:#9aa5ad;
}

.stationName{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.content{
    min-width:0;
    min-height:0;
    background:#fff;
}

#diagramContainer{
    width:100%;
    height:100%;
    overflow:auto;
    position:relative;
    -webkit-overflow-scrolling:touch;
    background:#fff;
}

#diagram{
    display:block;
}

#stationLabelOverlay{
    position:sticky;
    left:0;
    top:0;
    z-index:20;
    width:72px;
    height:0;
    margin-bottom:0;
    pointer-events:none;
    overflow:visible;
    background:#fff;
    border-right:1px solid #e5e8eb;
}

.stationFixedLabel{
    position:absolute;
    right:8px;
    white-space:nowrap;
    text-align:right;
    font-size:12px;
    line-height:16px;
    color:#252c32;
    background:#fff;
    padding-left:4px;
}

.stationFixedLabel.hidden{
    color:#9ba3aa;
}


#empty{
    padding:30px;
    color:#6c7881;
    font-size:13px;
}

#trainInfo{
    display:none;
    position:fixed;
    z-index:100;
    top:100px;
    right:8px;
    width:min(300px,calc(100vw - 16px));
    padding:11px;
    background:rgba(255,255,255,.97);
    border:1px solid #cfd5da;
    border-radius:10px;
    box-shadow:0 8px 28px rgba(20,35,50,.16);
    font-size:11px;
}

#trainInfoTitle{
    font-weight:700;
    font-size:14px;
    margin-bottom:7px;
}

.infoLine{
    margin:3px 0;
}

.muted{
    color:#6d7880;
}

#tableContainer{width:100%;height:100%;overflow:auto;padding:0;margin:0;box-sizing:border-box;}
/* Timetable: station rows / train columns */
.timeTable .stationHead{
    position:sticky;
    left:0;
    z-index:3;
    background:#fff;
    white-space:nowrap;
}
.timeTable thead .stationHead{z-index:5;}
.timeTable .trainHead{
    white-space:nowrap;
    min-width:58px;
}
.timeTable .timeCell{
    text-align:center;
    white-space:nowrap;
}
.timeTable .passedCell{
    font-weight:700;
}
.timeTable .viaNoneCell{
    text-align:center;
}
.viaNoneMark{
    display:inline-block;
    transform:rotate(90deg);
    font-weight:600;
    line-height:1;
}

.timeTableWrap{width:max-content;min-width:100%;margin:0;padding:0;box-sizing:border-box;}
.timeTable{border-collapse:collapse;border-spacing:0;width:max-content;font-size:11px;background:#fff;margin:0;}
.timeTable th,.timeTable td{border:1px solid #d9dee2;padding:3px 8px;white-space:nowrap;text-align:center;}
.timeTable thead th{position:sticky;top:0;z-index:5;background:#f6f8fa;font-weight:700;}
.timeTable th.stationHead{position:sticky;left:0;z-index:7;background:#fff;text-align:left;}
.timeTable td.trainHead{position:sticky;left:0;z-index:6;background:#fff;text-align:left;font-weight:600;}
.timeTable .timeCell{font-variant-numeric:tabular-nums;}
.timeTable .emptyCell{color:#b0b7bd;}
.timeTable .trackName{font-size:9px;line-height:1.1;color:inherit;opacity:.82;}
.timeTable .timeStack{display:block;line-height:1.15;}
/* 発着時はセル高を通常のほぼ2段分にし、仕切りを高さの50%へ固定 */
.timeTable .timeStack.bothTimes{position:relative;height:24px;min-height:24px;line-height:1.15;}
.timeTable .timeStack.bothTimes .timePart{position:absolute;left:0;right:0;height:12px;min-height:12px;display:flex;align-items:center;justify-content:center;line-height:12px;padding:0;margin:0;}
.timeTable .timeStack.bothTimes .arrivalTime{top:0;}
.timeTable .timeStack.bothTimes .departureTime{top:12px;}
.timeTable .timeStack.bothTimes .arrDepDivider{position:absolute;left:0;right:0;top:12px;height:0;border-top:1px solid #d9dee2;line-height:0;}
.timeTable .timePart{display:flex;align-items:center;justify-content:center;min-height:10px;line-height:1.15;}
.timeTable .timePart.arrivalOnly{align-items:flex-start;padding-top:1px;}
.timeTable .timePart.departureOnly{align-items:flex-end;padding-bottom:1px;}

/* 時刻表の境界線：通常＝同一駅の着発、路線分岐だけ太線 */
.timeTable tr.sameStationBoundary > th,
.timeTable tr.sameStationBoundary > td{
    border-top:1px solid #d9dee2 !important;
}
.timeTable tr.branchBoundary > th,
.timeTable tr.branchBoundary > td,
.timeTable tr.branchBoundaryAfter > th,
.timeTable tr.branchBoundaryAfter > td{
    border-top:4px solid #38444d !important;
}
table{
    box-sizing:border-box;
    border-collapse:collapse;
    width:max-content;
    min-width:100%;
    font-size:11px;
}

th,td{
    border:1px solid #d9dee2;
    padding:7px 8px;
    white-space:nowrap;
    text-align:left;
}

th{
    position:sticky;
    top:0;
    z-index:5;
    background:#f1f4f6;
}

tr.trainRow{
    cursor:pointer;
}

tr.trainRow:hover{
    background:var(--accentSoft);
}

@media(max-width:900px){

    .toolbar{
        overflow-x:auto;
        flex-wrap:nowrap;
        scrollbar-width:none;
    }

    .toolbar::-webkit-scrollbar{
        display:none;
    }

    .legend,
    .statusPill{
        display:none;
    }

    .appHeader{
        height:52px;
    }

    .ghostButton{
        display:none;
    }

    .ratioControl{
        display:flex;
    }
}

@media(max-width:600px){

    .brandMark{
        width:28px;
        height:28px;
    }

    .appHeader h1{
        font-size:12px;
    }

    .subTitle{
        font-size:9px;
    }

    .toolbar{
        min-height:54px;
    }

    .primaryButton{
        padding:0 8px;
    }

    .segment{
        padding:0 8px;
    }
}
.tableContainer{overflow:hidden;margin:0;padding:0;}
</style>
</head>

<body>

<header class="appHeader">

    <div class="brand">

        <div class="brandMark">時</div>

        <div>
            <h1>OuDiaSecond Viewer</h1>
            <div class="subTitle" id="fileName">
                ファイル未選択
            </div>
        </div>

    </div>

    <div class="headerActions">
        <button class="menuButton" id="viewMenuButton" type="button" aria-label="表示切替">
            ⋮
        </button>
        <div class="viewMenu" id="viewMenu">
            <button type="button" data-menu-view="kudariTable">下り時刻表</button>
            <button type="button" data-menu-view="noboriTable">上り時刻表</button>
            <button type="button" data-menu-view="diagram">ダイヤグラム</button>
            <div class="menuSetting">
                <label><input type="checkbox" id="timetableColorToggle" checked> 時刻表をカラー表示</label>
            </div>
        </div>
        <button class="ghostButton" id="resetViewButton" type="button">表示をリセット</button>
    </div>

</header>


<div class="toolbar">

    <div class="controlGroup">

        <label class="primaryButton">

            <span>＋ .oud2を開く</span>

            <input
                id="fileInput"
                type="file"
                accept=".oud2,.oud,.txt">

        </label>

    </div>


    <div class="controlGroup" id="diaControl">

        <span class="controlLabel">
            ダイヤ
        </span>

        <select id="diaSelect" disabled></select>

    </div>


    <!-- =====================================================
         方向
    ====================================================== -->

    <div class="segmented" id="directionControl">

        <button
            type="button"
            class="segment active"
            data-direction="Kudari">
            下り
        </button>

        <button
            type="button"
            class="segment"
            data-direction="Nobori">
            上り
        </button>

        <button
            type="button"
            class="segment"
            data-direction="Both">
            両方
        </button>

    </div>


    <!-- =====================================================
         表示
    ====================================================== -->




    <!-- =====================================================
         ズーム
    ====================================================== -->

    <div class="controlGroup compact" id="zoomControl">

        <span class="controlLabel">
            拡大
        </span>

        <button
            type="button"
            class="iconButton"

            −
        </button>

        <input
            id="zoomInput"
            type="number"
            value="100"
            min="50"
            max="300"
            step="10">

        <span class="percent">%</span>

        <button
            type="button"
            class="iconButton"
            id="zoomPlus">
            ＋
        </button>

    </div>


    <!-- =====================================================
         横比率
    ====================================================== -->

    <div class="controlGroup compact ratioControl" id="horizontalRatioControl">

        <span class="controlLabel">

        </span>

        <button

            class="iconButton">
            −
        </button>

        <span
            id="horizontalValue"
            class="ratioValue">
            12 px/分
        </span>

        <button
            id="horizontalPlus"

            ＋
        </button>

    <!-- =====================================================
         縦比率
    ====================================================== -->

            −

                .oud2ファイルを読み込んでください。
            </div>

                id="diagram"
                xmlns="http://www.w3.org/2000/svg">
            </svg>

            <div id="trainInfo">

                <div id="trainInfoTitle"></div>

                <div id="trainInfoBody"></div>

            </div>

        </div>


        <div id="tableContainer" style="display:none"></div>



    </section>

</div>


<script>


/* =========================================================
   BRANCH ROW DEDUPLICATION
========================================================= */
function dedupeStationRows(rows){
    const result=[];
    const seen=new Set();

    for(const row of (rows||[])){
        const index=
            row && Number.isInteger(row.stationIndex)
                ? row.stationIndex
                : null;

        if(index===null) continue;
        if(seen.has(index)) continue;

        seen.add(index);
        result.push(row);
    }

    return result;
}

/* =========================================================
   DATABASE
========================================================= */

let database=null;


/* =========================================================
   RATIO
========================================================= */

let verticalRatio=12;
let horizontalRatio=12;

const ratioStep=2;


/* =========================================================
   ELEMENTS
========================================================= */

const fileInput=
    document.getElementById("fileInput");

const fileName=
    document.getElementById("fileName");

const diaSelect=
    document.getElementById("diaSelect");

const diagramContainer=
    document.getElementById("diagramContainer");

function syncStationLabelScroll(){
    stationLabelOverlay.style.transform=
        "translateY(-"+diagramContainer.scrollTop+"px)";
}

const diagram=
    document.getElementById("diagram");

const stationLabelOverlay=
    document.getElementById("stationLabelOverlay");

const tableContainer=
    document.getElementById("tableContainer");

const trainTable=
    document.getElementById("trainTable");

const trainInfo=
    document.getElementById("trainInfo");

const trainInfoTitle=
    document.getElementById("trainInfoTitle");

const trainInfoBody=
    document.getElementById("trainInfoBody");

const legend=
    document.getElementById("legend");

const status=
    document.getElementById("status");

const empty=
    document.getElementById("empty");

const zoomInput=
    document.getElementById("zoomInput");

const horizontalValue=
    document.getElementById("horizontalValue");

const verticalValue=
    document.getElementById("verticalValue");


/* =========================================================
   STATE
========================================================= */

let currentDirection="Kudari";
let currentView="diagram";


/* =========================================================
   RATIO UI
========================================================= */

function updateRatioUI(){

    horizontalValue.textContent=
        horizontalRatio+" px/分";

    verticalValue.textContent=
        verticalRatio+" px/分";

}


/* =========================================================
   RATIO EVENTS
========================================================= */

document
.getElementById("horizontalMinus")
.addEventListener("click",function(){

    horizontalRatio=
        Math.max(
            1,
            horizontalRatio-ratioStep
        );

    updateRatioUI();

    if(database)render();

});


document
.getElementById("horizontalPlus")
.addEventListener("click",function(){

    horizontalRatio+=ratioStep;

    updateRatioUI();

    if(database)render();

});


document
.getElementById("verticalMinus")
.addEventListener("click",function(){

    verticalRatio=
        Math.max(
            1,
            verticalRatio-ratioStep
        );

    updateRatioUI();

    if(database)render();

});


document
.getElementById("verticalPlus")
.addEventListener("click",function(){

    verticalRatio+=ratioStep;

    updateRatioUI();

    if(database)render();

});


updateRatioUI();


/* =========================================================
   FILE
========================================================= */

fileInput.addEventListener(
    "change",
    async function(){

        const file=this.files[0];

        if(!file)return;

        try{

            status.textContent=
                "読み込み中...";

            const buffer=
                await file.arrayBuffer();

            const text=
                decodeOudFile(buffer);

            database=
                parseOudFile(text);

            fileName.textContent=
                file.name;

            setupUI();

            render();

        }catch(error){

            console.error(error);

            status.textContent=
                "解析エラー: "+
                error.message;

            alert(
                "ファイルの解析に失敗しました。\n\n"+
                error.message
            );

        }

    }
);


/* =========================================================
   ENCODING
========================================================= */

function decodeOudFile(buffer){

    const bytes=
        new Uint8Array(buffer);

    if(
        bytes[0]===0xEF &&
        bytes[1]===0xBB &&
        bytes[2]===0xBF
    ){

        return new TextDecoder(
            "utf-8"
        ).decode(buffer);

    }

    const utf8=
        new TextDecoder(
            "utf-8"
        ).decode(buffer);

    if(
        utf8.includes(
            "FileType=OuDiaSecond"
        )
    ){

        return utf8;

    }

    return new TextDecoder(
        "shift-jis"
    ).decode(buffer);

}


/* =========================================================
   BASIC PARSER
========================================================= */

function splitLines(text){

    return text
        .replace(/\r\n/g,"\n")
        .replace(/\r/g,"\n")
        .split("\n");

}


function parseKeyValue(line){

    const pos=
        line.indexOf("=");

    if(pos<0)return null;

    return{
        key:line.substring(0,pos),
        value:line.substring(pos+1)
    };

}


function readSimpleBlock(lines,startIndex){

    const object={};

    let i=startIndex+1;

    for(;i<lines.length;i++){

        if(lines[i]===".")break;

        const pair=
            parseKeyValue(lines[i]);

        if(pair){
            object[pair.key]=pair.value;
        }

    }

    return{
        object,
        end:i
    };

}


/* =========================================================
   ROUTE
========================================================= */

function parseRouteInfo(lines){

    const route={
        name:"",
        kudariAlias:"",
        noboriAlias:""
    };

    for(let i=0;i<lines.length;i++){

        if(lines[i]!=="Rosen.")continue;

        const result=
            readSimpleBlock(lines,i);

        route.name=
            result.object.Rosenmei||"";

        route.kudariAlias=
            result.object.KudariDiaAlias||"";

        route.noboriAlias=
            result.object.NoboriDiaAlias||"";

        break;

    }

    return route;

}


/* =========================================================
   STATIONS
========================================================= */

function parseStations(lines){

    const stations=[];

    for(let i=0;i<lines.length;i++){

        if(lines[i]!=="Eki.")continue;

        const o={};
        const trackNames=[];
        let j=i+1;

        /*
         * Eki. ブロックは EkiTrack2. などの
         * 子ブロックを含むため、単純な readSimpleBlock では
         * 番線情報より後ろを読み切れない。
         * 次の Eki. までを駅ブロックとして走査する。
         */
        for(;j<lines.length;j++){

            if(lines[j]==="Eki.")break;

            const pair=parseKeyValue(lines[j]);
            if(pair){

                if(pair.key==="TrackName"){
                    trackNames.push(pair.value);
                }else{
                    o[pair.key]=pair.value;
                }

            }

        }

        if(!o.Ekimei)continue;

        let branchCoreIndex=null;
        if(
            o.BrunchCoreEkiIndex!==undefined &&
            /^\d+$/.test(String(o.BrunchCoreEkiIndex).trim())
        ){
            branchCoreIndex=Number(o.BrunchCoreEkiIndex);
        }

        let loopOriginIndex=null;
        if(
            o.LoopOriginEkiIndex!==undefined &&
            /^\d+$/.test(String(o.LoopOriginEkiIndex).trim())
        ){
            loopOriginIndex=Number(o.LoopOriginEkiIndex);
        }

        stations.push({
            index:stations.length,
            name:o.Ekimei,
            timeFormat:o.Ekijikokukeisiki||"",
            scale:o.Ekikibo||"",
            downMain:o.DownMain||"0",
            upMain:o.UpMain||"0",
            hidden:o.Hidden==="1",
            branchCoreIndex,
            loopOriginIndex,

            /* 駅側に定義されている番線名をそのまま保持 */
            trackNames,

            /* 時刻表で番線を出すか */
            trackDisplayKudari:o.JikokuhyouTrackDisplayKudari==="1",
            trackDisplayNobori:o.JikokuhyouTrackDisplayNobori==="1",
            trackOmit:o.JikokuhyouTrackOmit==="1",

            /* カスタマイズ時刻表の着/発表示設定（左=着、右=発） */
            timetableDisplayKudari:(String(o.JikokuhyouJikokuDisplayKudari||"").split(",").map(v=>v.trim()==="1")),
            timetableDisplayNobori:(String(o.JikokuhyouJikokuDisplayNobori||"").split(",").map(v=>v.trim()==="1")),

            raw:o
        });

        i=j-1;

    }

    stations.forEach(function(station){

        if(
            station.branchCoreIndex!==null &&
            (
                station.branchCoreIndex<0 ||
                station.branchCoreIndex>=stations.length ||
                station.branchCoreIndex===station.index
            )
        ){
            station.branchCoreIndex=null;
        }

    });

    return stations;

}

/* =========================================================
   TRAIN TYPES
========================================================= */

function parseTrainTypes(lines){

    const types=[];

    for(let i=0;i<lines.length;i++){

        if(
            lines[i]!=="Ressyasyubetsu."
        )continue;

        const result=
            readSimpleBlock(lines,i);

        const o=result.object;

        types.push({

            index:types.length,

            name:
                o.Syubetsumei||"",

            short:
                o.Ryakusyou||
                o.Syubetsumei||
                "",

            textColor:
                oudiaColor(
                    o.JikokuhyouMojiColor
                ),

            diagramColor:
                oudiaColor(
                    o.DiagramSenColor
                ),

            lineStyle:
                o.DiagramSenStyle||"",

            stopMark:
                o.StopMarkDrawType||"",

            hidden:
                o.Hidden==="1",

            raw:o

        });

        i=result.end;

    }

    return types;

}


/* =========================================================
   COLOR
========================================================= */

function oudiaColor(value){

    if(!value)return"#333333";

    let v=
        String(value)
            .replace(/^0x/i,"")
            .padStart(8,"0");

    const rr=v.substring(6,8);
    const gg=v.substring(4,6);
    const bb=v.substring(2,4);

    return"#"+rr+gg+bb;

}


/* =========================================================
   TIME
========================================================= */

function parseTimeNumber(value){

    if(
        value===undefined ||
        value===null ||
        value===""
    ){
        return null;
    }

    let s=
        String(value).trim();

    if(!/^\d+$/.test(s)){
        return null;
    }

    let hour;
    let minute;

    if(s.length===6){

        hour=
            Number(
                s.substring(0,2)
            );

        minute=
            Number(
                s.substring(2,4)
            );

    }else{

        s=
            s.padStart(4,"0");

        if(s.length!==4){
            return null;
        }

        hour=
            Number(
                s.substring(0,2)
            );

        minute=
            Number(
                s.substring(2,4)
            );

    }

    if(
        !Number.isFinite(hour) ||
        !Number.isFinite(minute) ||
        minute<0 ||
        minute>59
    ){
        return null;
    }

    /*
     * OuDia の 00～01時帯を
     * 翌日扱いに寄せる。
     */

    if(hour<2){
        hour+=24;
    }

    if(hour>26){
        return null;
    }

    return hour*60+minute;

}


/* =========================================================
   EKI JIKOKU
========================================================= */

function parseEkiJikoku(value){

    return String(value??"")
        .split(",")
        .map(function(cell){

            cell=cell.trim();

            if(!cell){

                return{
                    exists:false,
                    passed:false,
                    handling:null,
                    arrival:null,
                    departure:null,
                    track:null,
                    raw:""
                };

            }

            let handling=null;
            let timePart=cell;

            const semicolon=
                cell.indexOf(";");

            if(semicolon>=0){

                const handlingText=
                    cell.substring(
                        0,
                        semicolon
                    );

                handling=
                    /^\d+$/.test(
                        handlingText
                    )
                    ? Number(
                        handlingText
                    )
                    : handlingText;

                timePart=
                    cell.substring(
                        semicolon+1
                    );

            }

            let track=null;

            const dollar=
                timePart.indexOf("$");

            if(dollar>=0){

                const trackText=
                    timePart.substring(
                        dollar+1
                    );

                if(
                    /^\d+$/.test(trackText)
                ){

                    track=
                        Number(trackText);

                }

                timePart=
                    timePart.substring(
                        0,
                        dollar
                    );

            }

            let arrival=null;
            let departure=null;
            let single=false;
            let singleTime=null;

            const hasSlash=
                timePart.includes("/");

            /*
             * 例:
             *
             * 2$0
             *
             * のような通過表現。
             */

            const isPassOnly=
                dollar>=0 &&
                !hasSlash &&
                (
                    handling===2 ||
                    timePart==="2"
                );

            if(!isPassOnly){

                if(hasSlash){

                    const parts=
                        timePart.split("/");

                    arrival=
                        parts[0]
                        ? parseTimeNumber(parts[0])
                        : null;

                    departure=
                        parts[1]
                        ? parseTimeNumber(parts[1])
                        : null;

                }else{

                    if(timePart!==""){

                        const t=
                            parseTimeNumber(
                                timePart
                            );

                        arrival=null;
                        departure=null;
                        single=true;
                        singleTime=t;

                    }

                }

            }

            const passed=
                arrival===null &&
                departure===null;

            return{

                exists:true,

                passed,

                handling,

                arrival,

                departure,

                single,
                singleTime,

                track,

                raw:cell

            };

        });

}


function normalizeSingleTime(cell, station, direction){
    if(!cell || !cell.single || cell.singleTime===null || !station) return cell;
    const t=cell.singleTime;

    /*
     * 単独時刻は「実際に入っている1時刻」だけを表示する。
     * 特に発着駅(Jikokukeisiki_Hatsuchaku)でも、単独の発時刻を
     * 着時刻まで複製しない。
     *
     * カスタマイズ時刻表の着/発表示設定を優先し、
     * 片方だけ表示対象なら、その側の時刻として扱う。
     * 両方が表示対象の場合は、駅の端点位置から始発/終着を判断し、
     * それでも判定できない場合は発時刻として1件だけ保持する。
     */
    const flags = direction === "Kudari"
        ? station.timetableDisplayKudari
        : station.timetableDisplayNobori;
    const showArrival = !!(flags && flags[0]===true);
    const showDeparture = !!(flags && flags[1]===true);

    switch(station.timeFormat){
        case "Jikokukeisiki_Hatsu":
            cell.arrival=null;
            cell.departure=t;
            break;

        case "Jikokukeisiki_NoboriChaku":
            if(direction === "Nobori"){
                cell.arrival=t; cell.departure=null;
            }else{
                cell.arrival=null; cell.departure=t;
            }
            break;

        case "Jikokukeisiki_KudariChaku":
            if(direction === "Kudari"){
                cell.arrival=t; cell.departure=null;
            }else{
                cell.arrival=null; cell.departure=t;
            }
            break;

        case "Jikokukeisiki_Hatsuchaku":
            /* 単独時刻を着発の両方へ複製しない */
            if(showDeparture && !showArrival){
                cell.arrival=null;
                cell.departure=t;
            }else if(showArrival && !showDeparture){
                cell.arrival=t;
                cell.departure=null;
            }else{
                /* 両方表示設定でも、単独実時刻は1件だけ */
                cell.arrival=null;
                cell.departure=t;
            }
            break;

        default:
            cell.arrival=t;
            cell.departure=null;
            break;
    }

    cell.passed=false;
    return cell;
}
function normalizeTrainTimes(train, stations){
    if(!train || !Array.isArray(train.times)) return;
    train.times.forEach(function(cell,index){
        if(cell) normalizeSingleTime(cell, stations[index], train.direction);
    });
}

/* =========================================================
   DIAS
========================================================= */

function parseDias(lines, stations){

    const dias=[];

    for(let i=0;i<lines.length;i++){

        if(lines[i]!=="Dia.")continue;

        const dia={
            name:"",
            trains:[]
        };

        let direction="";
        let j=i+1;

        while(
            j<lines.length &&
            lines[j]!=="Dia."
        ){

            if(lines[j]==="Kudari."){

                direction="Kudari";

                j++;

                continue;

            }

            if(lines[j]==="Nobori."){

                direction="Nobori";

                j++;

                continue;

            }

            if(lines[j]==="Ressya."){

                const result=
                    readSimpleBlock(
                        lines,
                        j
                    );

                const o=result.object;

                if(o.EkiJikoku){

                    const train={

                        index:
                            dia.trains.length,

                        direction:
                            o.Houkou||
                            direction,

                        typeIndex:
                            Number(
                                o.Syubetsu??0
                            ),

                        times:
                            parseEkiJikoku(
                                o.EkiJikoku
                            ),

                        operations:{},

                        raw:o

                    };

                    normalizeTrainTimes(train, stations);

                    Object.keys(o)
                        .forEach(function(key){

                            if(
                                key.startsWith(
                                    "Operation"
                                )
                            ){

                                train.operations[key]=
                                    o[key];

                            }

                        });

                    dia.trains.push(train);

                }

                j=
                    result.end+1;

                continue;

            }

            const pair=
                parseKeyValue(lines[j]);

            if(
                pair &&
                pair.key==="DiaName"
            ){

                dia.name=
                    pair.value;

            }

            j++;

        }

        dias.push(dia);

        i=
            Math.max(
                i+1,
                j-1
            );

    }

    return dias;

}

function parseOudFile(text){

    const lines=splitLines(text);
    const stations=parseStations(lines);

    return{
        route:parseRouteInfo(lines),
        stations,
        types:parseTrainTypes(lines),
        dias:parseDias(lines, stations),
        rawText:text
    };

}


/* =========================================================
   BRANCH
========================================================= */

function getBranchRoot(index){

    if(
        !database ||
        !database.stations[index]
    ){
        return index;
    }

    let current=index;
    const visited=new Set();

    while(
        database.stations[current] &&
        database.stations[current]
            .branchCoreIndex!==null &&
        !visited.has(current)
    ){

        visited.add(current);

        const next=
            database.stations[current]
                .branchCoreIndex;

        if(
            next===null ||
            next===undefined ||
            !database.stations[next]
        ){
            break;
        }

        current=next;

    }

    return current;

}


function sameBranchStation(a,b){

    if(a===b)return false;

    return(
        getBranchRoot(a)===
        getBranchRoot(b)
    );

}


/* =========================================================
   DIRECTION HELPERS
========================================================= */

/*
 * ここが今回の重要部分。
 *
 * 内部データの駅番号は常に
 *
 *   0 → 1 → 2 → 3 ...
 *
 * つまり「下り方向」。
 *
 * 上り列車は元データでは
 *
 *   3 → 2 → 1 → 0
 *
 * の順になるが、
 *
 * 描画座標では
 *
 *   0 → 1 → 2 → 3
 *
 * に変換する。
 *
 * これによって、
 *
 * 下りだけ
 * 上りだけ
 * 両方
 *
 * すべて同じ「上→下」の画面になる。
 */


/*
 * 上り列車の元データ駅番号を
 * 下り基準の表示駅番号へ変換する。
 *
 * 例えば4駅なら
 *
 * 元:
 *   上り 3,2,1,0
 *
 * 表示:
 *   0,1,2,3
 */
function displayStationIndex(
    originalIndex,
    direction
){

    const n=
        database.stations.length;

    if(direction==="Nobori"){

        return n-1-originalIndex;

    }

    return originalIndex;

}


/*
 * 表示上の駅一覧。
 *
 * 「上りだけ」のときだけ逆順にする。
 *
 * 「両方」は下り基準。
 */
function getVisibleStationIndices(){

    const n=
        database.stations.length;

    const result=[];

    if(currentDirection==="Nobori"){

        for(let i=n-1;i>=0;i--){
            result.push(i);
        }

    }else{

        for(let i=0;i<n;i++){
            result.push(i);
        }

    }

    return result;

}


/*
 * 駅一覧の表示番号から、
 * 実データの駅番号を得る。
 */
function visibleToOriginalStationIndex(
    visibleIndex
){

    const visible=
        getVisibleStationIndices();

    return visible[visibleIndex];

}


/* =========================================================
   TRAIN FILTER
========================================================= */

function getVisibleTrains(dia){

    if(!dia)return[];

    if(currentDirection==="Both"){

        return dia.trains.filter(
            train=>
                train.direction==="Kudari" ||
                train.direction==="Nobori"
        );

    }

    return dia.trains.filter(
        train=>
            train.direction===currentDirection
    );

}

function renderTimeTable(direction){
    if(!database)return;
    const dia=database.dias[Number(diaSelect.value)];
    if(!dia)return;

    const trains=dia.trains.filter(function(train){
        return train.direction===direction;
    });

    const stations=database.stations;

    function validBranchIndex(station){
        return station && Number.isInteger(station.branchCoreIndex) &&
            station.branchCoreIndex>=0 && station.branchCoreIndex<stations.length &&
            station.branchCoreIndex!==station.index;
    }

    function branchBoundaryBefore(index){
        if(index<=0)return false;
        const left=stations[index-1], right=stations[index];
        if(!left || !right)return false;

        /* 分離型：下り着の直後に、同じ基幹駅を指す上り着駅が来る。 */
        if(validBranchIndex(right) &&
           right.branchCoreIndex < index &&
           right.timeFormat === "Jikokukeisiki_NoboriChaku" &&
           left.timeFormat === "Jikokukeisiki_KudariChaku"){
            return true;
        }

        /* 合流型：上り着の派生駅の直後に発着の基幹駅が来る。 */
        if(validBranchIndex(left) &&
           left.branchCoreIndex < index &&
           left.timeFormat === "Jikokukeisiki_NoboriChaku" &&
           right.timeFormat === "Jikokukeisiki_Hatsuchaku"){
            return true;
        }

        /* 始発側V字：路線の先頭駅そのものが上り着駅で、
           後方の基幹駅をBrunchCoreEkiIndexで参照する。 */
        if(index===1){
            const first=stations[0];
            if(validBranchIndex(first) &&
               first.branchCoreIndex>first.index &&
               first.timeFormat === "Jikokukeisiki_NoboriChaku"){
                return true;
            }
        }
        return false;
    }

    function branchBoundaryAfter(index){
        if(index<0 || index>=stations.length-1)return false;
        const left=stations[index], right=stations[index+1];
        if(!left || !right)return false;

        /* 合流型：下り着の派生駅から発着の基幹駅へ。 */
        if(validBranchIndex(left) &&
           left.branchCoreIndex > index &&
           left.timeFormat === "Jikokukeisiki_KudariChaku" &&
           right.timeFormat === "Jikokukeisiki_Hatsuchaku"){
            return true;
        }

        /* 終着側V字：路線の末尾駅そのものが下り着駅で、
           前方の基幹駅をBrunchCoreEkiIndexで参照する。 */
        if(index===stations.length-2){
            const last=stations[stations.length-1];
            if(validBranchIndex(last) &&
               last.branchCoreIndex<last.index &&
               last.timeFormat === "Jikokukeisiki_KudariChaku"){
                return true;
            }
        }
        return false;
    }

    function sameStationBoundary(index){
        if(index<=0)return false;
        const a=stations[index-1];
        const b=stations[index];
        return !!(
            a && b &&
            a.name===b.name &&
            a.index!==b.index
        );
    }

    /*
     * 始発側V字分岐。
     * 例：
     *   新府 ─────────＼
     *   新府本町 ─ 宮前 ─ 青葉町
     *
     *   → 新府
     *      青葉町
     *      ━━━━━━━
     *      新府本町
     *      宮前
     *      青葉町
     *      ━━━━━━━
     *      青葉町
     *
     * BrunchCoreEkiIndex は「分岐側駅」から「基幹駅」を指す。
     * 始発側では、最初の駅を含む枝、分岐側の駅列、基幹駅以降の本線を
     * 3ブロックとして表示する。
     */
    /*
     * 始発側分岐。
     *
     * 例:
     *   新府 ─────────＼
     *   新府本町 ─ 宮前 ─ 青葉町
     *
     * 駅配列上は「本線の始発駅 → 分岐側駅 → … → 基幹駅」と
     * 並んでいるため、BrunchCoreEkiIndex が自駅より後方を指す
     * 分岐側駅を見つけたら、駅配列を3ブロックに分けて表示する。
     * 発着の判定はここでは一切行わない。
     */
    let displayRows=stations.map(function(st){
        return {station:st, boundaryBefore:false, duplicate:false};
    });

    const startSideBranch=stations
        .slice(0, Math.max(1, Math.floor(stations.length/2)))
        .find(function(st){
            return validBranchIndex(st) &&
                st.branchCoreIndex>st.index &&
                st.index>0;
        });

    if(startSideBranch){
        const b=startSideBranch.index;
        const c=startSideBranch.branchCoreIndex;

        /* 第1ブロック：本線の始発駅 → 分岐側の終点
         *
         * 始発側V字では、BrunchCoreEkiIndex の c は
         * 「もう一方の本線側で使う基幹駅」。
         * 第1ブロックの終点は c ではなく、分岐側駅 b。
         *
         * 例:
         *   新府(0) ─────＼
         *   青葉町(1)       ← b
         *   新府本町(2) ─ 宮前(3) ─ 青葉町(6) ← c
         *
         * → 新府 / 青葉町(1) / 境界
         */
        const firstBlock=[
            {station:stations[0], boundaryBefore:false, duplicate:false},
            {station:stations[b], boundaryBefore:false, duplicate:false}
        ];

        /* 第2ブロック：分岐側の始発駅 → 基幹駅 */
        const secondBlock=[];
        for(let i=b+1;i<=c;i++){
            secondBlock.push({
                station:stations[i],
                boundaryBefore:i===b+1,
                duplicate:i===c
            });
        }

        /* 第3ブロック：基幹駅から先
         *
         * 第2ブロックの末尾ですでに stations[c] を表示しているため、
         * 第3ブロックでは c をもう一度生成しない。
         *
         * これにより、
         *   … 青葉町(6)
         *   ━━━━━━━
         *   青葉町(6)
         *
         * という不自然な重複＋太線を防ぐ。
         * 第2→第3ブロックの境界そのものも、同一駅の再掲ではないので
         * 始発側V字ではここに境界線を置かない。
         */
        const thirdBlock=[];
        for(let i=c+1;i<stations.length;i++){
            thirdBlock.push({
                station:stations[i],
                boundaryBefore:false,
                duplicate:false
            });
        }

        displayRows=firstBlock.concat(secondBlock,thirdBlock);
    }

    let html='<div class="timeTableWrap"><table class="timeTable"><thead><tr>';
    html+='<th class="stationHead">駅名</th>';

    trains.forEach(function(train){
        const type=database.types[train.typeIndex]||{name:"不明",textColor:"#333333"};
        const title=train.name||type.name||"";
        const colorStyle=timetableColorEnabled ? ' style="color:'+escapeHtml(type.textColor||"#333333")+'"' : '';
        html+='<th class="trainHead"'+colorStyle+'>'+escapeHtml(title)+'</th>';
    });
    html+='</tr></thead><tbody>';

    displayRows.forEach(function(row,displayIndex){
        const station=row.station;
        const stationIndex=station.index;
        let rowClass='';
        if(row.boundaryBefore || branchBoundaryBefore(stationIndex)) rowClass='branchBoundary';
        else if(sameStationBoundary(stationIndex)) rowClass='sameStationBoundary';
        else if(branchBoundaryAfter(stationIndex)) rowClass='branchBoundaryAfter';

        html+='<tr class="'+rowClass+'">';
        html+='<th class="stationHead">'+escapeHtml(station.name)+'</th>';

        trains.forEach(function(train){
            const time=train.times[stationIndex];
            let content='';
            let cls='timeCell';
            const type=database.types[train.typeIndex]||{textColor:'#333333'};
            const cellColor=timetableColorEnabled ? (type.textColor||'#333333') : '';
            const cellStyle=cellColor ? ' style="color:'+escapeHtml(cellColor)+'"' : '';

            if(time && time.exists===true){
                const isActualSingleTime = time.single===true &&
                    time.singleTime!==null && time.singleTime!==undefined;
                if(time.passed===true && !isActualSingleTime){
                    content='レ';
                    cls+=' passedCell';
                }else{
                    /*
                     * 発着の表示可否はカスタマイズ時刻表の設定を正とする。
                     * 実データに存在しない着/発は補完しない。
                     * 着だけなら上段、発だけなら下段、両方なら上下に分ける。
                     */
                    const displayFlags = direction === "Kudari"
                        ? station.timetableDisplayKudari
                        : station.timetableDisplayNobori;
                    const showArrival = displayFlags && displayFlags[0] === true &&
                        time.arrival!==null && time.arrival!==undefined;
                    const showDeparture = displayFlags && displayFlags[1] === true &&
                        time.departure!==null && time.departure!==undefined;

                    if(showArrival || showDeparture){
                        if(showArrival && showDeparture){
                            content='<span class="timeStack bothTimes">'+
                                '<span class="timePart arrivalTime">'+formatTime(time.arrival)+'</span>'+
                                '<span class="arrDepDivider"></span>'+
                                '<span class="timePart departureTime">'+formatTime(time.departure)+'</span>'+
                                '</span>';
                        }else if(showArrival){
                            content='<span class="timeStack"><span class="timePart">'+formatTime(time.arrival)+'</span></span>';
                        }else{
                            content='<span class="timeStack"><span class="timePart">'+formatTime(time.departure)+'</span></span>';
                        }
                    }


                    if(
                        station.trackOmit!==true &&
                        (direction==="Kudari" ? station.trackDisplayKudari : station.trackDisplayNobori) &&
                        time.track!==null && time.track!==undefined &&
                        station.trackNames[time.track]
                    ){
                        content+='<br><span class="trackName">'+escapeHtml(station.trackNames[time.track])+'</span>';
                    }
                }
            }else{
                let first=-1,last=-1;
                for(let k=0;k<train.times.length;k++){
                    if(hasActualTime(train.times[k]) || train.times[k]?.passed===true){
                        if(first<0)first=k;
                        last=k;
                    }
                }
                if(first>=0 && stationIndex>first && stationIndex<last){
                    content='<span class="viaNoneMark">＝</span>';
                    cls+=' viaNoneCell';
                }
            }

            html+='<td class="'+cls+'"'+cellStyle+'>'+content+'</td>';
        });

        html+='</tr>';
    });

    html+='</tbody></table></div>';
    tableContainer.innerHTML=html;
}

/* =========================================================
   TIME ACCESS
========================================================= */

function hasActualTime(time){

    return !!(
        time &&
        time.exists===true &&
        (
            time.arrival!==null ||
            time.departure!==null
        )
    );

}


function usableTime(time){

    if(!hasActualTime(time)){
        return null;
    }

    if(
        time.departure!==null &&
        time.departure!==undefined
    ){

        return time.departure;

    }

    if(
        time.arrival!==null &&
        time.arrival!==undefined
    ){

        return time.arrival;

    }

    return null;

}


/* =========================================================
   SECTION RUNTIME
========================================================= */

/*
 * 重要:
 *
 * 駅間距離を決める時刻は
 *
 * 「下り列車だけ」
 *
 * から取得する。
 *
 * 上り列車は絶対に使用しない。
 */


function elapsedMinutes(start,end){

    if(
        !Number.isFinite(start) ||
        !Number.isFinite(end)
    ){
        return null;
    }

    let diff=
        end-start;

    if(diff<0){
        diff+=24*60;
    }

    return(
        diff>0 &&
        diff<=180
    )
        ? diff
        : null;

}


/*
 * 下り列車専用。
 *
 * 前駅の発
 * ↓
 * 次駅の着
 *
 * で駅間時間を取る。
 */
function sectionRuntimeCandidates(
    train
){

    const result=
        new Array(
            Math.max(
                0,
                database.stations.length-1
            )
        ).fill(null);


    if(
        !train ||
        train.direction!=="Kudari" ||
        !train.times
    ){

        return result;

    }


    const limit=
        Math.min(
            train.times.length,
            database.stations.length
        )-1;


    for(
        let i=0;
        i<limit;
        i++
    ){

        const from=
            train.times[i];

        const to=
            train.times[i+1];


        /*
         * 両方に実時刻が必要。
         *
         * 通過駅を含む列車は
         * 駅間実測値には使わない。
         */
        if(
            !hasActualTime(from) ||
            !hasActualTime(to)
        ){

            continue;

        }


        const start=
            from.departure!==null &&
            from.departure!==undefined
                ? from.departure
                : from.arrival;


        const end=
            to.arrival!==null &&
            to.arrival!==undefined
                ? to.arrival
                : to.departure;


        const diff=
            elapsedMinutes(
                start,
                end
            );


        if(diff===null)continue;


        if(
            sameBranchStation(
                i,
                i+1
            )
        ){

            continue;

        }


        result[i]=Math.max(
            result[i]??0,
            diff
        );

    }


    return result;

}


/*
 * 駅間時間の全下り列車最大値。
 */
function calculateSectionHeights(
    dia
){

    const n=
        database.stations.length;

    const result=
        new Array(
            Math.max(0,n-1)
        ).fill(null);


    /*
     * ★ここで下り列車だけに限定
     */
    const downTrains=
        dia.trains.filter(
            train=>
                train.direction==="Kudari"
        );


    for(
        let i=0;
        i<n-1;
        i++
    ){

        if(
            sameBranchStation(
                i,
                i+1
            )
        ){

            continue;

        }


        let max=0;


        for(
            const train of downTrains
        ){

            const candidates=
                sectionRuntimeCandidates(
                    train
                );

            const diff=
                candidates[i];


            if(
                diff!==null &&
                diff>=0.1 &&
                diff<=180
            ){

                max=
                    Math.max(
                        max,
                        diff
                    );

            }

        }


        result[i]=
            max>0
                ? max
                : null;

    }


    return result;

}


/* =========================================================
   STATION Y
========================================================= */

function calculateStationY(
    dia,
    zoom
){

    const n=
        database.stations.length;


    /*
     * ★下りだけから算出
     */
    const section=
        calculateSectionHeights(
            dia
        );


    const y=[
        45*zoom
    ];


    const pixelsPerMinute=
        verticalRatio*zoom;


    for(
        let i=0;
        i<n-1;
        i++
    ){

        const minutes=
            section[i];


        /*
         * 実測値なし区間は
         * 最低5分分だけ確保。
         */
        const height=
            minutes!==null &&
            minutes!==undefined
                ? minutes*pixelsPerMinute
                : 5*pixelsPerMinute;


        y.push(
            y[i]+height
        );

    }


    return{
        y,
        section
    };

}

   DIAGRAM
